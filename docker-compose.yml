services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qms_incub
      POSTGRES_PASSWORD: qms_incub
      POSTGRES_DB: qms_incub
    ports:
      # Host-side 5433, not 5432 — 5432 collides with a locally-installed
      # Postgres on plenty of laptops. Container-internal port is unchanged.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qms_incub"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  qdrant-data:
