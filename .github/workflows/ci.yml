name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # V1 (SLICES.md): the ingestion integration test needs a real
      # Qdrant to write to and query. No LLM service here — the e2e test
      # that needs a live LLM (Ollama/OpenRouter) is local-only, marked
      # `e2e`, and excluded from this run (see backend/pyproject.toml).
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
      # V5: the batch-ingestion integration test needs a migrated Postgres
      # to persist PolicyDocumentRow status. Port/credentials match
      # docker-compose.yml and config.py's DATABASE_URL default.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qms_incub
          POSTGRES_PASSWORD: qms_incub
          POSTGRES_DB: qms_incub
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U qms_incub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv run alembic upgrade head
      - run: uv run pytest -q -m integration

  frontend:
    name: frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: npm run build
