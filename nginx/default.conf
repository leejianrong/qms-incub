# Single-origin dev proxy (ADR-0017). Everything the browser talks to goes
# through this one host port (APP_PORT) — /api/* to the backend, everything
# else (including Vite's HMR websocket) to the frontend dev server. Because
# the browser only ever sees one origin, CORS never comes into play here.
server {
    listen 80;

    # PDF uploads (/documents, /projects/{id}/aor, /todos/{id}/artifacts)
    # exceed nginx's 1m default well before hitting FastAPI's own limits.
    client_max_body_size 30m;

    # Strip the /api prefix: /api/documents -> backend's /documents.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ingestion (POST /documents) parses+chunks+embeds synchronously
        # (AGENTS.md) — a real PDF, or a cold start still downloading the
        # embedding model, easily clears nginx's 60s default and 504s
        # while the backend keeps working. /chat's LLM round-trip can
        # also run long depending on provider/model.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vite dev server, including its HMR websocket upgrade.
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
