[project]
name = "synthetic-corpus"
version = "0.0.1"
description = "Independent tool that generates realistic QMS-policy-shaped PDFs on local disk (ADR-0012). No shared code with backend/, no HTTP call to it."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "jinja2>=3.1",
    "weasyprint>=63",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "pypdf>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthetic_corpus"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

# No stubs/py.typed marker upstream.
[[tool.mypy.overrides]]
module = "weasyprint"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
