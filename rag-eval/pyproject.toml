[project]
name = "rag-eval"
version = "0.0.1"
description = "Scores the backend's retrieval quality (NDCG/Recall/MRR) against a gold set derived from synthetic-corpus's Q&A pairs. Unlike synthetic-corpus, this does depend on qms_incub (backend/) — it scores the real RetrievalPort implementation, via a local path dependency, not vendored/duplicated code."
requires-python = ">=3.12"
dependencies = [
    "qms-incub",
    "qdrant-client>=1.12",
]

[tool.uv.sources]
qms-incub = { path = "../backend", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
